name: Auto Post Video to YouTube
on:
  repository_dispatch:
    types: [post-video]
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Install Tools
        run: |
          pip install gdown google-auth google-auth-oauthlib google-api-python-client

      - name: Download Video from Drive
        run: |
          VIDEO_URL="${{ github.event.client_payload.video_url }}"
          echo "Downloading: $VIDEO_URL"
          gdown --fuzzy "$VIDEO_URL" -O video.mp4
          ls -lh video.mp4

      - name: Upload to YouTube
        shell: python
        env:
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
        run: |
          import os
          import json
          import random
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          
          # Load credentials
          creds_json = os.environ.get("YOUTUBE_CREDENTIALS")
          creds = json.loads(creds_json)
          
          credentials = Credentials(
              token=None,
              refresh_token=creds['refresh_token'],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=creds['client_id'],
              client_secret=creds['client_secret']
          )
          
          youtube = build('youtube', 'v3', credentials=credentials)
          
          # 30 Universal Titles - Based on caption styles
          TITLES = [
              # MYSTERIOUS / CRYPTIC STYLE (10 titles)
              "Found Footage - SD Card Recovery #shorts #analoghorror #foundfootage",
              "Unexplained Camera Footage - 8 Seconds #shorts #horror #mysterious",
              "Evidence File - Location Unknown #shorts #creepy #investigation",
              "Cold Case Footage - 2019 #shorts #mystery #unsolved",
              "Recovered Body Cam - Last Transmission #shorts #horror #bodycam",
              "Thrift Store Discovery - Warning #shorts #analoghorror #scary",
              "Missing Person Case - Final Recording #shorts #mystery #footage",
              "Unsolved Investigation - Declassified #shorts #paranormal #evidence",
              "Lost Footage Archive - Unknown Origin #shorts #horror #mysterious",
              "Case File #4762 - Do Not Share #shorts #creepy #redacted",
              
              # FIRST PERSON / JOURNAL STYLE (10 titles)
              "Last Recording - If You Find This #shorts #horror #warning",
              "My Final Upload - Something Followed Me #shorts #scary #pov",
              "Day 3 Exploration Log - Send Help #shorts #investigation #lost",
              "Camera Keeps Cutting Out #shorts #analoghorror #glitch",
              "I Shouldn't Have Gone Back #shorts #horror #mistake",
              "Warning - Delete This Footage #shorts #creepy #urgent",
              "Alone in Abandoned Location #shorts #exploration #horror",
              "Phone Dying - Uploading Now #shorts #scary #lastwords",
              "Something Following Me - Can't See It #shorts #horror #stalked",
              "Wrong About Everything #shorts #mystery #realization",
              
              # MINIMALIST / ATMOSPHERIC (5 titles)
              "02:34 AM - No Audio After 0:07 #shorts #timestamp #horror",
              "Abandoned Location - Never Returned #shorts #creepy #atmospheric",
              "What Is That Standing There #shorts #horror #entity",
              "It Was Waiting #shorts #scary #ominous",
              "Coordinates - Do Not Investigate #shorts #mystery #warning",
              
              # DOCUMENTARY / INVESTIGATION STYLE (5 titles)
              "Active Case - Unknown Entity #shorts #investigation #paranormal",
              "Missing Hiker - Body Cam Found #shorts #horror #newsfootage",
              "Archived Footage - Corrupted Drive #shorts #recovered #mysterious",
              "Paranormal Investigation - Team Missing #shorts #research #horror",
              "Urban Legend Proved - Last Recording #shorts #folklore #scary"
          ]
          
          # 20 Universal Analog Horror Captions - Rotates randomly
          CAPTIONS = [
              # MYSTERIOUS / CRYPTIC STYLE
              "Found this on an SD card at a thrift store.\nDate stamp says 2:34 AM.\nThe camera was still recording when they found it.",
              
              "Why was he running?\nFootage recovered 3 miles from last known location.\nBattery died at 8 seconds.",
              
              "Last transmission: 04:43 AM\nSearch team found the camera.\nNever found him.",
              
              "EVIDENCE #4762\nLocation: [REDACTED]\nStatus: UNSOLVED\nDo not share this footage.",
              
              "Case went cold in 2019.\nThis was the only thing they recovered.\n8 seconds of footage.\nThen nothing.",
              
              # FIRST PERSON / JOURNAL STYLE
              "I shouldn't have gone back there.\nThis was my last recording.\nIf you're seeing this, I didn't make it out.",
              
              "To whoever finds this:\nDon't go looking for me.\nDon't go to that place.\nJust delete this.",
              
              "I thought it was abandoned.\nI thought I was alone.\nI was wrong about both.",
              
              "Something's following me.\nCan't see it clearly.\nCamera keeps cutting out.\nThis might be my last upload.",
              
              "Day 3 of exploration.\nFound something I can't explain.\nUploading before my phone dies.\nSend help to coordinates in bio.",
              
              # MINIMALIST / ATMOSPHERIC
              "02:34:19 AM\n[NO AUDIO AFTER 0:07]",
              
              "Recorded: Abandoned Church, Rural Virginia\nNever returned.",
              
              "What is that standing there?",
              
              "It was waiting.",
              
              "41°49'32\"N 71°42'11\"W\nDo not investigate.",
              
              # DOCUMENTARY / INVESTIGATION STYLE
              "CASE #2847 - ACTIVE\nSubject: Unknown Entity\nClassification: UNEXPLAINED\nThis footage has been declassified.\nViewer discretion advised.",
              
              "Hiker reported missing March 2019.\nBody cam recovered 6 months later.\nAuthorities never released this footage.\nUntil now.",
              
              "ARCHIVED FOOTAGE - 2018\nRecovered from corrupted hard drive.\nOriginal investigator: Status Unknown\nMake of this what you will.",
              
              "Paranormal Investigation Log #47\nLead Researcher: Dr. [REDACTED]\nTeam never reported back.\nThis is all that remains.",
              
              "Local legend says don't go there after midnight.\nHe wanted to prove them wrong.\nThis is the last thing his camera recorded.\nThey never found the body."
          ]
          
          # Fixed description with disclaimer
          DESCRIPTION_TEMPLATE = (
              "⚠️ FICTIONAL CONTENT - Created for entertainment\n\n"
              "{caption}\n\n"
              "━━━━━━━━━━━━━━━━━━━━━━\n\n"
              "ARCHIVE 47 - UNEXPLAINED FOOTAGE COLLECTION\n\n"
              "Welcome to Archive 47, a collection of mysterious and unsettling footage from unknown origins.\n\n"
              "⚠️ DISCLAIMER: All content on this channel is FICTIONAL and created for entertainment purposes. "
              "These are AI-generated horror short films and creative cinematography experiments designed to evoke "
              "atmosphere and suspense. None of the footage represents real events, locations, or incidents.\n\n"
              "🎬 WHAT WE CREATE:\n"
              "• Found footage style horror shorts\n"
              "• POV atmospheric cinematography\n"
              "• Analog horror experiences\n"
              "• Creature feature clips\n"
              "• Mysterious location explorations\n"
              "• Cinematic suspense scenes\n\n"
              "📼 CONTENT STYLE: Inspired by analog horror, found footage films, and atmospheric storytelling. "
              "Each video is an 8-second glimpse into fictional mysterious scenarios - from deep ocean expeditions "
              "to abandoned locations, space stations to ancient ruins.\n\n"
              "🎨 PRODUCTION: All videos are AI-generated artistic creations combining:\n"
              "• Cinematic camera work\n"
              "• Atmospheric sound design\n"
              "• Horror film aesthetics\n"
              "• Creative storytelling\n\n"
              "👁️ FOR FANS OF: Analog horror, found footage films, The Backrooms, SCP Foundation, "
              "creepypasta, atmospheric horror, cinematic shorts, mystery content\n\n"
              "🔔 New mysterious footage uploaded regularly\n"
              "💬 Share your theories in the comments\n"
              "👍 Subscribe for more unexplained cinema\n\n"
              "REMEMBER: This is creative fiction for horror entertainment. Enjoy responsibly.\n\n"
              "🎵 Sound effects licensed/royalty-free\n"
              "🤖 AI-assisted content creation\n\n"
              "#AnalogHorror #FoundFootage #HorrorShorts #CreativeContent #FictionalFootage #AIGenerated #Shorts"
          )
          
          # Pick random title and caption
          title = random.choice(TITLES)
          caption = random.choice(CAPTIONS)
          description = DESCRIPTION_TEMPLATE.format(caption=caption)
          
          print(f"Uploading with title: {title[:70]}...")
          print(f"Using caption: {caption[:60]}...")
          
          request = youtube.videos().insert(
              part="snippet,status",
              body={
                  "snippet": {
                      "title": title[:100],
                      "description": description,
                      "tags": ["shorts", "analog horror", "found footage", "horror", 
                               "creepy", "ai generated", "fictional", "mysterious",
                               "scary", "pov horror", "surveillance footage", "body cam",
                               "unexplained", "paranormal", "investigation", "abandoned",
                               "urban exploration", "creepypasta", "atmospheric horror"],
                      "categoryId": "24"
                  },
                  "status": {
                      "privacyStatus": "public",
                      "selfDeclaredMadeForKids": False
                  }
              },
              media_body=MediaFileUpload("video.mp4", resumable=True)
          )
          
          response = request.execute()
          video_id = response['id']
          print(f"Uploaded! Video ID: {video_id}")
          print(f"URL: https://youtube.com/shorts/{video_id}")
          
          # Mark as AI-generated content
          try:
              youtube.videos().update(
                  part="status",
                  body={
                      "id": video_id,
                      "status": {
                          "selfDeclaredMadeForKids": False,
                          "containsSyntheticMedia": True
                      }
                  }
              ).execute()
              print("Marked as AI-generated content")
          except Exception as e:
              print(f"Could not set AI label: {e}")
