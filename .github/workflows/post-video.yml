name: Auto Post Video to YouTube
on:
  repository_dispatch:
    types: [post-video]
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Install Tools
        run: |
          pip install gdown google-auth google-auth-oauthlib google-api-python-client

      - name: Download Video from Drive
        run: |
          VIDEO_URL="${{ github.event.client_payload.video_url }}"
          echo "Downloading: $VIDEO_URL"
          gdown --fuzzy "$VIDEO_URL" -O video.mp4
          ls -lh video.mp4

      - name: Upload to YouTube
        shell: python
        env:
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
        run: |
          import os
          import json
          import random
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          
          # Load credentials
          creds_json = os.environ.get("YOUTUBE_CREDENTIALS")
          creds = json.loads(creds_json)
          
          credentials = Credentials(
              token=None,
              refresh_token=creds['refresh_token'],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=creds['client_id'],
              client_secret=creds['client_secret']
          )
          
          youtube = build('youtube', 'v3', credentials=credentials)
          
          # 10 Random titles
          TITLES = [
              "\u2620\ufe0fFictional Horror Analog Cam Short! #ai #shortsviral #horror #mysterious #analoghorror",
              "\U0001F4FCFictional Found Footage Horror Short! #ai #creepy #shortsviral #mysterious #horror",
              "\u26a0\ufe0fFictional Mystery Analog Camera Short! #ai #scary #shortsviral #analoghorror #creepy",
              "\U0001F3A5Fictional Horror POV Cam Short! #ai #horror #shortsviral #mysterious #foundfootage",
              "\U0001F441\ufe0fFictional Creepy Analog Footage Short! #ai #shortsviral #horror #scary #mysterious",
              "\U0001F534Fictional Mystery Horror Cam Short! #ai #analoghorror #shortsviral #creepy #horror",
              "\U0001F4F9Fictional Scary Found Footage Short! #ai #horror #shortsviral #mysterious #analoghorror",
              "\U0001F480Fictional Horror Surveillance Cam Short! #ai #creepy #shortsviral #horror #mysterious",
              "\U0001F311Fictional Dark Analog Horror Short! #ai #scary #shortsviral #analoghorror #creepy",
              "\u26d4Fictional Mystery Camera Footage Short! #ai #horror #shortsviral #creepy #mysterious"
          ]
          
          # Fixed description
          DESCRIPTION = (
              "ARCHIVE 47 - UNEXPLAINED FOOTAGE COLLECTION\n\n"
              "Welcome to Archive 47, a collection of mysterious and unsettling footage from unknown origins.\n\n"
              "\u26a0\ufe0f DISCLAIMER: All content on this channel is FICTIONAL and created for entertainment purposes. "
              "These are AI-generated horror short films and creative cinematography experiments designed to evoke "
              "atmosphere and suspense. None of the footage represents real events, locations, or incidents.\n\n"
              "\U0001F3AC WHAT WE CREATE:\n"
              "\u2022 Found footage style horror shorts\n"
              "\u2022 POV atmospheric cinematography\n"
              "\u2022 Analog horror experiences\n"
              "\u2022 Creature feature clips\n"
              "\u2022 Mysterious location explorations\n"
              "\u2022 Cinematic suspense scenes\n\n"
              "\U0001F4FC CONTENT STYLE: Inspired by analog horror, found footage films, and atmospheric storytelling. "
              "Each video is an 8-second glimpse into fictional mysterious scenarios - from deep ocean expeditions "
              "to abandoned locations, space stations to ancient ruins.\n\n"
              "\U0001F3A8 PRODUCTION: All videos are AI-generated artistic creations combining:\n"
              "\u2022 Cinematic camera work\n"
              "\u2022 Atmospheric sound design\n"
              "\u2022 Horror film aesthetics\n"
              "\u2022 Creative storytelling\n\n"
              "\U0001F441\ufe0f FOR FANS OF: Analog horror, found footage films, The Backrooms, SCP Foundation, "
              "creepypasta, atmospheric horror, cinematic shorts, mystery content\n\n"
              "\U0001F514 New mysterious footage uploaded regularly\n"
              "\U0001F4AC Share your theories in the comments\n"
              "\U0001F44D Subscribe for more unexplained cinema\n\n"
              "REMEMBER: This is creative fiction for horror entertainment. Enjoy responsibly.\n\n"
              "\U0001F3B5 Sound effects licensed/royalty-free\n"
              "\U0001F916 AI-assisted content creation\n\n"
              "#AnalogHorror #FoundFootage #HorrorShorts #CreativeContent #FictionalFootage #AIGenerated #Shorts"
          )
          
          # Pick random title
          title = random.choice(TITLES)
          
          print(f"Uploading with title: {title[:50]}...")
          
          request = youtube.videos().insert(
              part="snippet,status",
              body={
                  "snippet": {
                      "title": title[:100],
                      "description": DESCRIPTION,
                      "tags": ["shorts", "analog horror", "found footage", "horror", 
                               "creepy", "ai generated", "fictional", "mysterious",
                               "scary", "pov horror", "surveillance footage"],
                      "categoryId": "24"
                  },
                  "status": {
                      "privacyStatus": "public",
                      "selfDeclaredMadeForKids": False
                  }
              },
              media_body=MediaFileUpload("video.mp4", resumable=True)
          )
          
          response = request.execute()
          video_id = response['id']
          print(f"Uploaded! Video ID: {video_id}")
          print(f"URL: https://youtube.com/shorts/{video_id}")
          
          # Mark as AI-generated content
          try:
              youtube.videos().update(
                  part="status",
                  body={
                      "id": video_id,
                      "status": {
                          "selfDeclaredMadeForKids": False,
                          "containsSyntheticMedia": True
                      }
                  }
              ).execute()
              print("Marked as AI-generated content")
          except Exception as e:
              print(f"Could not set AI label: {e}")
